[package]
name = "mare-capi"
description = "MARÉ's client library for C and C++: connect to a hub and run its cycles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# `mareclient.dll` and `mareclient.dll.lib` on Windows, `libmareclient.so`
# on Linux, `libmareclient.dylib` on macOS, and the static libraries beside them.
name = "mareclient"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mare-client.workspace = true
mare-protocol.workspace = true
mare-sys.workspace = true

[dev-dependencies]
mare-hub.workspace = true
mare-sys.workspace = true

# Finds the Microsoft C compiler, which is not on the path, for the tests
# that compile C and C++ against the library.
[target.'cfg(windows)'.dev-dependencies]
cc = "1.2"

[lints]
workspace = true
