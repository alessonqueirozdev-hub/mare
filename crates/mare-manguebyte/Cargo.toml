[package]
name = "mare-manguebyte"
description = "MARÉ as an audio backend of the Manguebyte Audio Framework: programs built on Manguebyte play through a MARÉ hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mare-client.workspace = true
mare-sys.workspace = true
# The framework, at a fixed revision of its public repository. MIDI stays
# with Manguebyte's device manager, so its MIDI feature is not needed here.
manguebyte-core = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4" }
manguebyte-devices = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4", default-features = false }

[dev-dependencies]
mare-hub.workspace = true
# A plugin run by Manguebyte's standalone, playing through a hub.
manguebyte-dsp = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4" }
manguebyte-params = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4" }
manguebyte-plugin = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4" }
manguebyte-standalone = { git = "https://github.com/alessonqueirozdev-hub/manguebyte", rev = "3369941529918eb87d3e71d3f59aecbbace964c4" }

[lints]
workspace = true
