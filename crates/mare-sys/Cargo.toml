[package]
name = "mare-sys"
description = "What MARÉ needs from the operating system: named shared memory, doorbells to wake the other side, and watching a process end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
